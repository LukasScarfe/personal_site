name: Deploy Hugo site to Pages

on:
  push:
    branches: ["master"] # Pushes to main trigger the build
  workflow_dispatch: # Allows you to manually trigger it

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive # CRITICAL: Loads the Blowfish theme
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          # PINNED, do not set back to 'latest'. The Blowfish theme declares
          # min 0.141.0 / max 0.154.5 (themes/blowfish/config.toml). 'latest'
          # drifted to Hugo 0.164.0, which removed site.Author and broke the
          # build in layouts/partials/footer.html. Bump this only after checking
          # the theme's declared max.
          hugo-version: '0.154.5'
          extended: true # REQUIRED for Blowfish

      - name: Build
        # --cleanDestinationDir removes files in ./public that this build did not
        # generate. Without it, any stale public/ contents are uploaded and served —
        # which is how a `draft: true` page and three renamed slugs stayed live.
        run: hugo --minify --cleanDestinationDir

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4